<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GFX Preview Bridge</title>
		<style>
			html,
			body,
			iframe {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				border: 0;
				overflow: hidden;
				background: #000;
			}
		</style>
	</head>
	<body>
		<iframe id="template" title="GFX template"></iframe>
		<script type="module">
			import { resolveBridgeTemplateSrc } from './gfx-preview-bridge-utils.mjs'

			const params = new URLSearchParams(window.location.search)
			const templatePath = params.get('template')
			const templateFrame = document.getElementById('template')
			let templateReady = false
			let pendingData
			let pendingAction

			const templateSrc = resolveBridgeTemplateSrc(
				templatePath,
				window.location.href,
				window.location.origin
			)
			if (!templateSrc) {
				document.body.textContent = 'Invalid template query parameter'
				throw new Error('Invalid template query parameter')
			}

			templateFrame.src = templateSrc

			// Templates resolve fonts via local() — inject the same @font-face set
			// the demo-assets preview tool injects so preview matches on-air type.
			const fonts = `
@font-face {font-family:Bauplan;font-weight:900;src:url('/fonts/Bauplan/WOFF2/Bauplan-Heavy.woff2') format('woff2')}
@font-face {font-family:Bauplan;font-weight:400;src:url('/fonts/Bauplan/WOFF2/Bauplan-Regular.woff2') format('woff2')}
@font-face {font-family:Diform;font-weight:700;src:url('/fonts/Diform/WOFF2/Diform-Bold.woff2') format('woff2')}
@font-face {font-family:Diform;font-weight:400;src:url('/fonts/Diform/WOFF2/Diform-Regular.woff2') format('woff2')}
`

			function applyPreviewData(data, action) {
				const win = templateFrame.contentWindow
				if (!win || data === undefined) {
					return
				}
				if (action === 'stop') {
					if (typeof win.stop === 'function') {
						win.stop()
					}
					return
				}
				if (typeof win.update === 'function') {
					win.update(data)
				}
				if (action === 'update') {
					return
				}
				if (typeof win.play === 'function') {
					win.play(data)
				}
			}

			function flushPendingData() {
				if (!templateReady || pendingData === undefined) {
					return
				}
				applyPreviewData(pendingData, pendingAction)
				pendingData = undefined
				pendingAction = undefined
			}

			function notifyReady() {
				window.parent.postMessage({ type: 'sofie-gfx-preview-ready' }, '*')
			}

			window.addEventListener('message', (event) => {
				if (event.source !== window.parent) {
					return
				}
				if (event.data?.type !== 'sofie-gfx-preview') {
					return
				}
				pendingData = event.data.xml ?? event.data.json ?? event.data.payload
				pendingAction = event.data.action
				flushPendingData()
			})

			templateFrame.addEventListener('load', () => {
				try {
					const style = templateFrame.contentDocument.createElement('style')
					style.textContent = fonts
					templateFrame.contentDocument.head.append(style)
				} catch { /* Fonts are best-effort. */ }
				templateReady = true
				flushPendingData()
				notifyReady()
			})

			notifyReady()
		</script>
	</body>
</html>
