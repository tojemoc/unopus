<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>L3D Šport Preview</title>
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				background: #111;
				color: #fff;
				font-family: Arial, Helvetica, sans-serif;
				min-height: 100vh;
				display: flex;
				align-items: flex-end;
				padding: 24px;
			}
			.l3d {
				background: rgba(0, 0, 0, 0.75);
				border-left: 6px solid #2ca02c;
				padding: 12px 20px;
				width: 100%;
				max-width: 100%;
			}
			.kicker { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #7dff9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.headline { font-size: 26px; font-weight: bold; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.source { font-size: 14px; color: #ccc; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		</style>
	</head>
	<body>
		<div class="l3d">
			<div class="kicker" id="kicker"></div>
			<div class="headline" id="headline"></div>
			<div class="source" id="source"></div>
		</div>
		<script>
			const params = new URLSearchParams(window.location.search)
			const kicker = params.get('kicker') || ''
			const kickerEl = document.getElementById('kicker')
			kickerEl.textContent = kicker
			kickerEl.style.display = kicker ? 'block' : 'none'
			document.getElementById('headline').textContent = params.get('headline') || 'Headline'
			const source = params.get('source') || ''
			const sourceEl = document.getElementById('source')
			sourceEl.textContent = source
			sourceEl.style.display = source ? 'block' : 'none'
		</script>
	</body>
</html>
