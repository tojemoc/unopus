name: Node CI

on:
  # PRs: typecheck + lint only. Production build runs on main merges.
  # Docker/GitHub releases stay in release.yaml (main + v* tags).
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Typecheck and Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: restore node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Prepare Environment
        run: |
          corepack enable
          yarn
        env:
          CI: true
      - name: Fetch sofie megarepo assets
        run: bash scripts/fetch-sofie-megarepo-assets.sh
      - name: Run typecheck and linter
        run: |
          yarn typecheck
          yarn lint
        env:
          CI: true

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Full TS emit + Vite production build only on main (not every PR push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack with yarn@4.9.1
        run: corepack enable && corepack prepare yarn@4.9.1 --activate

      - name: Install dependencies with Yarn
        run: yarn install --frozen-lockfile

      - name: Fetch sofie megarepo assets
        run: bash scripts/fetch-sofie-megarepo-assets.sh

      - name: Run build
        run: yarn build
