name: Dependencies Check

on:
  push:
    branches:
      - '**'
    tags:
      - 'v**'

permissions:
  contents: read

jobs:
  validate-prod-dependencies-packages:
    name: Validate Package production dependencies
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Prepare Environment
        run: |
          corepack enable
          yarn install
        env:
          CI: true
      - name: Validate production dependencies
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          gate="$(mktemp)"
          trap 'rm -f "$gate"' EXIT
          # Run the gate from the default branch so a pushed rewrite of the script
          # cannot force an always-skip. Authorization checks stay inside that script.
          if ! git show "origin/${DEFAULT_BRANCH}:scripts/ci-should-skip-audit.sh" >"$gate"; then
            echo "Trusted skip-audit gate missing on ${DEFAULT_BRANCH}; running validation"
            yarn validate:dependencies
            exit 0
          fi
          chmod +x "$gate"
          if bash "$gate"; then
            echo "Skipping audit"
          else
            yarn validate:dependencies
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  validate-all-dependencies-packages:
    name: Validate all Package dependencies
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Prepare Environment
        run: |
          corepack enable
          yarn install
        env:
          CI: true
      - name: Validate production dependencies
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          gate="$(mktemp)"
          trap 'rm -f "$gate"' EXIT
          if ! git show "origin/${DEFAULT_BRANCH}:scripts/ci-should-skip-audit.sh" >"$gate"; then
            echo "Trusted skip-audit gate missing on ${DEFAULT_BRANCH}; running validation"
            yarn validate:dependencies
            exit 0
          fi
          chmod +x "$gate"
          if bash "$gate"; then
            echo "Skipping audit"
          else
            yarn validate:dependencies
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Validate dev dependencies
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          gate="$(mktemp)"
          trap 'rm -f "$gate"' EXIT
          if ! git show "origin/${DEFAULT_BRANCH}:scripts/ci-should-skip-audit.sh" >"$gate"; then
            echo "Trusted skip-audit gate missing on ${DEFAULT_BRANCH}; running validation"
            yarn validate:dev-dependencies
            exit 0
          fi
          chmod +x "$gate"
          if bash "$gate"; then
            echo "Skipping audit"
          else
            yarn validate:dev-dependencies
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
